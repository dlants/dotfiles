# Minimal prompt inspired by pure
# https://github.com/sindresorhus/pure

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$character"""

[hostname]
ssh_only = true
style = "bold red"
format = "[dev]($style) "

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[git_branch]
format = "[git:$branch]($style) "
style = "bright-black"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bright-black"
staged = "+"
modified = "*"
untracked = "?"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
min_time = 5_000

